[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ipykernel-env-core"
dynamic = ["version"]
description = "Shared core for environment-managed IPython kernels (uv, pixi)"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
dependencies = [
    "jupyter_client>=7.0",
    # tomllib arrived in 3.11; tomli is the backport for 3.10.
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/jupyter-ai-contrib/ipykernel-env"
Source = "https://github.com/jupyter-ai-contrib/ipykernel-env"
Tracker = "https://github.com/jupyter-ai-contrib/ipykernel-env/issues"

[tool.hatch.version]
path = "src/ipykernel_env_core/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ipykernel_env_core"]
