# Workspace root for the ipykernel-env monorepo.
#
# This is a uv workspace used only for local development: it wires the three
# packages together so an editable install of a manager resolves the local
# `ipykernel-env-core`. It is not a published distribution.

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ipykernel-env-core = { workspace = true }
ipykernel-uv = { workspace = true }
ipykernel-pixi = { workspace = true }

[dependency-groups]
dev = [
    "ipykernel-env-core",
    "ipykernel-uv",
    "ipykernel-pixi",
]
