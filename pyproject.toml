[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ipykernel-uv"
version = "0.1.0"
description = "An IPython kernel that uses uv for package and environment management"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
dependencies = [
    "jupyter_client>=7.0",
    "jupyterlab>=4.5.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ipykernel_uv"]
